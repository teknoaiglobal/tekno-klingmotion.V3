<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="required-role" content="admin">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/auth-client.js"></script>
    <script src="/js/page-guard.js"></script>
    <style>
        body {
            visibility: hidden;
        }
        :root {
            --bg-color: #0f1115;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.05);
            --surface-active: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            font-family: inherit;
            font-size: 14px;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .btn-outline:hover {
            background: var(--surface-hover);
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 20px);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        #toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        .sync-wrap {
            display: flex;
            gap: 8px;
        }

        .sync-wrap .btn {
            width: auto;
            padding: 0 16px;
        }

        /* Mobile Responsiveness Improvements */
        @media (max-width: 576px) {
            body {
                padding: 20px 16px;
            }

            .container {
                padding: 24px 20px;
            }

            h2 {
                font-size: 20px;
            }

            .sync-wrap {
                flex-direction: column;
            }

            .sync-wrap .btn {
                width: 100%;
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>

            <input type="text" id="cloudinaryKey" placeholder="Contoh: 691892418329522">

            Pengaturan</button>
        <a href="kling motion.html" id="backLink" style="text-decoration: none;">

        </a>

    <div id="toast">Berhasil disimpan!</div>

    <script>
        // Authentication handled by page-guard.js
        
        const els = {
            apiUrl: document.getElementById('cloudinaryApiUrl'),
            cloudName: document.getElementById('cloudName'),
            apiKey: document.getElementById('cloudinaryKey'),
            apiSecret: document.getElementById('cloudinarySecret'),
            syncBtn: document.getElementById('syncBtn'),
            syncIcon: document.getElementById('syncIcon'),
            saveBtn: document.getElementById('saveBtn'),
            toast: document.getElementById('toast'),
            backLink: document.getElementById('backLink')
        };

        // Fix back link if inside cpanel-deploy context (where the main file is index.html instead of kling motion.html)
        if (window.location.pathname.includes('index.html') || window.location.pathname.includes('cpanel-deploy')) {
            els.backLink.href = 'index.html';
        }

        function showToast(msg, type = 'success') {
            els.toast.textContent = msg;
            els.toast.style.background = type === 'success' ? 'var(--success)' : 'var(--danger)';
            els.toast.style.boxShadow = type === 'success' ? '0 4px 15px rgba(16, 185, 129, 0.3)' : '0 4px 15px rgba(239, 68, 68, 0.3)';
            els.toast.classList.add('show');
            setTimeout(() => els.toast.classList.remove('show'), 3000);
        }

        // Load config from local storage
        const DEFAULT_API_URL = 'https://firestore.googleapis.com/v1/projects/tekno-335f8/databases/(default)/documents/artifacts/default-app-id/public/data/public_files/cloudinary?key=AIzaSyCirtabCZOy3XMnNLUc-iKIYGegZJbPqhw';
        els.apiUrl.value = localStorage.getItem('texa_cloudinary_api_url') || DEFAULT_API_URL;
        els.cloudName.value = localStorage.getItem('texa_cloud_name') || 'duwtvcfwk';
        els.apiKey.value = localStorage.getItem('texa_cloudinary_key') || '691892418329522';
        els.apiSecret.value = localStorage.getItem('texa_cloudinary_secret') || '';

        // Save Function
        els.saveBtn.addEventListener('click', () => {
            localStorage.setItem('texa_cloudinary_api_url', els.apiUrl.value.trim());
            localStorage.setItem('texa_cloud_name', els.cloudName.value.trim());
            localStorage.setItem('texa_cloudinary_key', els.apiKey.value.trim());
            localStorage.setItem('texa_cloudinary_secret', els.apiSecret.value.trim());
            showToast('Konfigurasi berhasil disimpan!', 'success');
        });

        // Sync Function
        els.syncBtn.addEventListener('click', async () => {
            const url = els.apiUrl.value.trim();
            if (!url) {
                showToast('Silakan masukkan API URL.', 'error');
                return;
            }
            els.syncIcon.classList.add('fa-spin');
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Gagal mengakses API URL');
                const data = await response.json();

                const contentStr = data?.fields?.content?.stringValue || '';
                if (!contentStr) throw new Error('Format Firestore tidak sesuai');

                const lines = contentStr.split('\n').map(l => l.trim()).filter(l => l);
                let updated = 0;
                for (let i = 0; i < lines.length - 1; i++) {
                    if (lines[i].includes('Cloud Name')) { els.cloudName.value = lines[i + 1]; updated++; }
                    else if (lines[i].includes('API Key')) { els.apiKey.value = lines[i + 1]; updated++; }
                    else if (lines[i].includes('API Secret')) { els.apiSecret.value = lines[i + 1]; updated++; }
                }

                if (updated > 0) {
                    els.saveBtn.click(); // Auto-save after syncing
                } else {
                    showToast('Data Cloudinary tidak ditemukan di API.', 'error');
                }
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            } finally {
                els.syncIcon.classList.remove('fa-spin');
            }
        });

        // Auto Sync unconditionally on load if URL is present
        if (els.apiUrl.value) {
            setTimeout(() => els.syncBtn.click(), 500); // 500ms delay to let UI render first
        }
    </script>

                chevron.style.transform = 'rotate(-90deg)';
            }

        async function fetchAdminData(isBackground = false) {
            if (!isBackground) console.log('[ADMIN] Fetching admin data...');
            try {
                const [uRes, kRes, sRes] = await Promise.all([
                    fetch('/api/admin/users'), fetch('/api/admin/apikeys'), fetch('/api/admin/settings')
                ]);
                
                console.log('[ADMIN] Response status:', {
                    users: uRes.status,
                    apikeys: kRes.status,
                    settings: sRes.status
                });
                
                const uData = await uRes.json();
                const kData = await kRes.json();
                const sData = await sRes.json();

                console.log('[ADMIN] Data received:', {
                    users: uData.users?.length || 0,
                    apiKeys: kData.apiKeys?.length || 0,
                    settings: !!sData.settings
                });

                renderApiKeys(kData.apiKeys || []);

                            </button>
                            <div id="mitra_${u.id}" class="mitra-box">
                                <input id="mitra_wa_${u.id}" type="text" value="${u.mitra_whatsapp || ''}" placeholder="WA Link (Opsional)" class="compact-input">
                                <textarea id="mitra_txt_${u.id}" placeholder="Popup Text (Opsional)" class="compact-input" style="resize:vertical; min-height:40px;">${u.mitra_popup_text || ''}</textarea>
                            </div>
                        </div>
                    </td>
                    <td>
                        <select id="plan_${u.id}" class="compact-input">
                            <option value="free" ${u.plan==='free'?'selected':''}>Free</option>
                            <option value="pro" ${u.plan==='pro'?'selected':''}>Pro</option>
                            <option value="vip" ${u.plan==='vip'?'selected':''}>VIP</option>
                        </select>
                    </td>
                    <td>
                        <input id="days_${u.id}" type="number" value="${remainingDays}" class="compact-input" style="width:60px; min-width:50px;">
                    </td>
                    <td>
                        <input id="credits_${u.id}" type="number" value="${u.credits}" class="compact-input" style="width:70px; min-width:60px;">
                    </td>
                    <td>
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                            <button onclick="saveUser('${u.id}')" class="btn btn-primary" style="padding: 6px 10px; font-size: 12px; margin: 0; width: auto;" title="Simpan"><i class="fa-solid fa-floppy-disk"></i></button>
                            <button onclick="deleteUser('${u.id}', this)" class="btn btn-outline" style="padding: 6px 10px; font-size: 12px; color: var(--danger); border-color: var(--danger); margin: 0; width: auto; transition: 0.2s;" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }



        function renderApiKeys(keys) {
            const tbody = document.getElementById('keysTableBody');
            if (!keys || keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-secondary);">Tidak ada API key. Klik "Add Key" untuk menambahkan.</td></tr>';
                return;
            }
            
            try {
                tbody.innerHTML = keys.map((k, index) => {
                    const isActive = k.is_active;
                    const bgColor = isActive ? 'transparent' : 'rgba(239, 68, 68, 0.1)';
                    const borderColor = isActive ? 'var(--border)' : 'var(--danger)';
                    const statusColor = isActive ? 'var(--success)' : 'var(--danger)';
                    const statusText = isActive ? 'Active' : 'Mati / Limit';
                    
                    return `
                        <tr style="border-bottom: 1px solid var(--border); background: ${bgColor};">
                            <td style="padding: 8px; text-align: center;">
                                <input type="checkbox" class="key-checkbox" data-key-id="${k.id}" onchange="updateBulkActions()" style="cursor: pointer;">
                            </td>
                            <td style="padding: 8px;">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <div style="display:flex; flex-direction:column; gap:2px;">
                                        <button onclick="moveKeyUp('${k.id}')" ${index === 0 ? 'disabled' : ''} class="btn btn-outline" style="padding: 2px 6px; font-size: 10px; margin: 0; width: auto;" title="Move Up"><i class="fa-solid fa-arrow-up"></i></button>
                                        <button onclick="moveKeyDown('${k.id}')" ${index === keys.length - 1 ? 'disabled' : ''} class="btn btn-outline" style="padding: 2px 6px; font-size: 10px; margin: 0; width: auto;" title="Move Down"><i class="fa-solid fa-arrow-down"></i></button>
                                    </div>
                                    <div style="flex:1;">
                                        <div style="display:flex; align-items:center; gap:4px; margin-bottom:4px;">
                                            <span style="font-size:11px; color:var(--text-secondary); font-weight:bold;">#${index + 1}</span>
                                            <input id="key_${k.id}" type="text" value="${k.key_string}" style="background: rgba(0,0,0,0.3); border: 1px solid ${borderColor}; color: white; padding: 4px; border-radius: 4px; font-family: monospace; width: 100%; font-size:11px;">
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td style="padding: 8px;">${k.usage_count || 0}</td>
                            <td style="padding: 8px; color: ${statusColor}; font-weight: bold;">${statusText}</td>
                            <td style="padding: 8px;">
                                <div style="display:flex; gap:4px; flex-wrap:wrap;">
                                    <button onclick="saveApiKey('${k.id}')" class="btn btn-primary" style="padding: 4px 8px; font-size: 11px; margin: 0; width: auto;"><i class="fa-solid fa-floppy-disk"></i></button>
                                    <button onclick="toggleApiKey('${k.id}', ${isActive})" class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; margin: 0; width: auto;"><i class="fa-solid fa-power-off"></i></button>
                                    <button onclick="deleteApiKey('${k.id}', this)" class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; color: var(--danger); border-color: var(--danger); margin: 0; width: auto; transition: 0.2s;"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error rendering API keys:', error);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--danger);">Error rendering keys. Check console.</td></tr>';
            }
        }

        // Actions
        window.saveUser = async (id) => {
            const plan = document.getElementById('plan_' + id).value;
            const credits = document.getElementById('credits_' + id).value;
            const duration_days = document.getElementById('days_' + id).value;
            const name = document.getElementById('name_' + id).value;
            const voucher_code = document.getElementById('voucher_' + id).value;
            const mitra_wa = document.getElementById('mitra_wa_' + id);
            const mitra_txt = document.getElementById('mitra_txt_' + id);
            const mitra_whatsapp = mitra_wa ? mitra_wa.value.trim() : '';
            const mitra_popup_text = mitra_txt ? mitra_txt.value.trim() : '';

            await fetch('/api/admin/users', { 
                method: 'PUT', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({id, plan, credits, duration_days, name, voucher_code, mitra_whatsapp, mitra_popup_text})
            });
            fetchAdminData();
            showToast('User berhasil disimpan!', 'success');
        };

        window.saveAdminSettings = async () => {
            const wa = document.getElementById('adminWhatsappLink').value.trim();
            const pop = document.getElementById('adminPopupText').value.trim();
            
            const nSuccessCreate = document.getElementById('notifSuccessCreate').value.trim();
            const nSuccessComplete = document.getElementById('notifSuccessComplete').value.trim();
            const nFailed = document.getElementById('notifFailed').value.trim();
            const nTokenRot = document.getElementById('notifTokenRotation').value.trim();
            
            try {
                await fetch('/api/admin/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        whatsappLink: wa, 
                        popupText: pop,
                        notifSuccessCreate: nSuccessCreate,
                        notifSuccessComplete: nSuccessComplete,
                        notifFailed: nFailed,
                        notifTokenRotation: nTokenRot
                    })
                });
                showToast('Pengaturan Notifikasi berhasil disimpan!', 'success');
            } catch(e) {
                showToast('Gagal menyimpan: ' + e.message, 'error');
            }
        };

        window.deleteUser = async (id, btn) => {
            if (!btn.dataset.confirm) {
                btn.dataset.confirm = '1';
                btn.innerHTML = 'Yakin?';
                btn.style.background = 'var(--danger)';
                btn.style.color = '#fff';
                setTimeout(() => {
                    if (btn) {
                        btn.dataset.confirm = '';
                        btn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                        btn.style.background = 'transparent';
                        btn.style.color = 'var(--danger)';
                    }
                }, 3000);
                return;
            }
            
            await fetch('/api/admin/users', { 
                method: 'DELETE', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({id})
            });
            fetchAdminData();
            showToast('User dihapus!', 'success');
        };

        window.addBlankUser = async () => {
            await fetch('/api/admin/users', { method: 'POST' });
            fetchAdminData();
            showToast('Member baru ditambahkan!', 'success');
        };

        window.toggleApiKey = async (id, currentStatus) => {
            await fetch('/api/admin/apikeys', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id, is_active: !currentStatus})});
            fetchAdminData();
            showToast('Status Token diupdate', 'success');
        };

        window.saveApiKey = async (id) => {
            const key_string = document.getElementById('key_' + id).value;
            await fetch('/api/admin/apikeys', {
                method: 'PUT',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ id, key_string })
            });
            fetchAdminData();
            showToast('Token berhasil diupdate!', 'success');
        };

        window.deleteApiKey = async (id, btn) => {
            if (!btn.dataset.confirm) {
                btn.dataset.confirm = '1';
                btn.innerHTML = 'Yakin?';
                btn.style.background = 'var(--danger)';
                btn.style.color = '#fff';
                setTimeout(() => {
                    if (btn) {
                        btn.dataset.confirm = '';
                        btn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                        btn.style.background = 'transparent';
                        btn.style.color = 'var(--danger)';
                    }
                }, 3000);
                return;
            }
            await fetch('/api/admin/apikeys', {
                method: 'DELETE',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ id })
            });
            fetchAdminData();
            showToast('Token dihapus!', 'success');
        };

        // Move API Key Up (higher priority)
        window.moveKeyUp = async (id) => {
            try {
                await fetch('/api/admin/apikeys?action=reorder', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ id, direction: 'up' })
                });
                fetchAdminData();
                showToast('Token dipindah ke atas!', 'success');
            } catch(e) {
                showToast('Gagal memindahkan token', 'error');
            }
        };

        // Move API Key Down (lower priority)
        window.moveKeyDown = async (id) => {
            try {
                await fetch('/api/admin/apikeys?action=reorder', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ id, direction: 'down' })
                });
                fetchAdminData();
                showToast('Token dipindah ke bawah!', 'success');
            } catch(e) {
                showToast('Gagal memindahkan token', 'error');
            }
        };

        document.getElementById('addKeyBtn').addEventListener('click', async () => {
            const keyInput = document.getElementById('newApiKey');
            const key_string = keyInput.value.trim();
            if(!key_string) return;
            await fetch('/api/admin/apikeys', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({key_string})});
            keyInput.value = '';
            fetchAdminData();
            showToast('API Key ditambahkan!', 'success');
        });

        // Bulk Actions Functions
        window.toggleSelectAll = (checkbox) => {
            const checkboxes = document.querySelectorAll('.key-checkbox');
            checkboxes.forEach(cb => cb.checked = checkbox.checked);
            updateBulkActions();
        };

        window.updateBulkActions = () => {
            const checkboxes = document.querySelectorAll('.key-checkbox');
            const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
            const bulkBar = document.getElementById('bulkActionsBar');
            const selectedCount = document.getElementById('selectedCount');
            const selectAllCheckbox = document.getElementById('selectAllKeys');
            
            // Update count
            selectedCount.textContent = `${checkedBoxes.length} dipilih`;
            
            // Show/hide bulk actions bar
            if (checkedBoxes.length > 0) {
                bulkBar.style.display = 'flex';
            } else {
                bulkBar.style.display = 'none';
            }
            
            // Update select all checkbox state
            if (checkedBoxes.length === checkboxes.length && checkboxes.length > 0) {
                selectAllCheckbox.checked = true;
                selectAllCheckbox.indeterminate = false;
            } else if (checkedBoxes.length > 0) {
                selectAllCheckbox.indeterminate = true;
            } else {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            }
        };

        window.clearSelection = () => {
            const checkboxes = document.querySelectorAll('.key-checkbox');
            checkboxes.forEach(cb => cb.checked = false);
            document.getElementById('selectAllKeys').checked = false;
            updateBulkActions();
        };

        window.bulkActivateKeys = async () => {
            const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
            const keyIds = Array.from(checkedBoxes).map(cb => cb.dataset.keyId);
            
            if (keyIds.length === 0) return;
            
            try {
                // Send bulk update request
                await fetch('/api/admin/apikeys?action=bulk', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ ids: keyIds, is_active: true })
                });
                
                clearSelection();
                fetchAdminData();
                showToast(`${keyIds.length} token berhasil diaktifkan!`, 'success');
            } catch(e) {
                showToast('Gagal mengaktifkan token: ' + e.message, 'error');
            }
        };

        window.bulkDeactivateKeys = async () => {
            const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
            const keyIds = Array.from(checkedBoxes).map(cb => cb.dataset.keyId);
            
            if (keyIds.length === 0) return;
            
            try {
                // Send bulk update request
                await fetch('/api/admin/apikeys?action=bulk', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ ids: keyIds, is_active: false })
                });
                
                clearSelection();
                fetchAdminData();
                showToast(`${keyIds.length} token berhasil dimatikan!`, 'success');
            } catch(e) {
                showToast('Gagal mematikan token: ' + e.message, 'error');
            }
        };

        window.bulkDeleteKeys = async () => {
            const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
            const keyIds = Array.from(checkedBoxes).map(cb => cb.dataset.keyId);
            
            if (keyIds.length === 0) return;

            if (!confirm(`Anda yakin ingin menghapus ${keyIds.length} token ini secara manual?`)) return;
            
            try {
                await fetch('/api/admin/apikeys?action=bulk', {
                    method: 'DELETE',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ ids: keyIds })
                });
                
                clearSelection();
                fetchAdminData();
                showToast(`${keyIds.length} token berhasil dihapus!`, 'success');
            } catch(e) {
                showToast('Gagal menghapus token: ' + e.message, 'error');
            }
        };

        window.triggerAutoCleanup = async () => {
            if (!confirm('Anda yakin ingin membersihkan (hapus) semua token yang sudah mati lebih dari 3 hari?')) return;

            const btn = document.querySelector('button[onclick="triggerAutoCleanup()"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/apikeys/cleanup', {
                    method: 'POST', // POST required for manual admin trigger
                    headers: {
                        'Content-Type': 'application/json',
                        'x-auth-token': localStorage.getItem('texa_auth_token') || '' // Include auth token if needed
                    }
                });

                if (!res.ok) {
                    const errObj = await res.json();
                    throw new Error(errObj.error || 'Server error');
                }

                const data = await res.json();
                
                clearSelection();
                fetchAdminData();
                showToast(`Berhasil! ${data.deleted_count} token lama telah dihapus.`, 'success');
            } catch(e) {
                showToast('Gagal cleanup: ' + e.message, 'error');
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        };

        // Wait for page-guard to complete authentication, then fetch data
        window.addEventListener('DOMContentLoaded', () => {
            // Small delay to ensure page-guard has completed
            setTimeout(() => {
                fetchAdminData();
                
                // Real-time polling for keys (every 5 seconds)
                // Only update if admin is NOT currently selecting checkboxes to avoid interrupting their work
                setInterval(async () => {
                    const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
                    const selectAllCheckbox = document.getElementById('selectAllKeys');
                    
                    // Cek apakah admin sedang fokus mengetik di input manapun
                    const isTyping = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
                    
                    if (checkedBoxes.length === 0 && (!selectAllCheckbox || !selectAllCheckbox.checked) && !isTyping) {
                        // HANYA update API keys (untuk melihat usage/status real-time), 
                        // JANGAN panggil fetchAdminData() penuh agar form Users tidak ter-reset.
                        try {
                            const kRes = await fetch('/api/admin/apikeys');
                            const kData = await kRes.json();
                            renderApiKeys(kData.apiKeys || []);
                        } catch (e) {
                            console.error("[ADMIN] Background fetch keys error:", e);
                        }
                    }
                }, 5000);
                
            }, 500);
        });
    </script>
</body>

</html>
