<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="required-role" content="admin">
    <title>Cloudinary Admin - TEXA</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/auth-client.js"></script>
    <script src="/js/page-guard.js"></script>
    <style>
        body {
            visibility: hidden;
        }
        :root {
            --bg-color: #0f1115;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.05);
            --surface-active: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            font-family: inherit;
            font-size: 14px;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .btn-outline:hover {
            background: var(--surface-hover);
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translate(-50%, 20px);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        #toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        .sync-wrap {
            display: flex;
            gap: 8px;
        }

        .sync-wrap .btn {
            width: auto;
            padding: 0 16px;
        }

        /* Mobile Responsiveness Improvements */
        @media (max-width: 576px) {
            body {
                padding: 20px 16px;
            }

            .container {
                padding: 24px 20px;
            }

            h2 {
                font-size: 20px;
            }

            .sync-wrap {
                flex-direction: column;
            }

            .sync-wrap .btn {
                width: 100%;
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2><i class="fa-solid fa-cloud"></i> Cloudinary Admin</h2>
        <div class="subtitle">Simpan konfigurasi API Cloudinary secara aman di local browser.</div>

        <div class="form-group">
            <label>Sync API URL (Opsional)</label>
            <div class="sync-wrap">
                <input type="text" id="cloudinaryApiUrl" placeholder="Masukkan URL API Firestore di sini...">
                <button id="syncBtn" class="btn" title="Sync Now"><i class="fa-solid fa-arrows-rotate"
                        id="syncIcon"></i></button>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 24px 0;">

        <div class="form-group">
            <label>Cloud Name</label>
            <input type="text" id="cloudName" placeholder="Contoh: duwtvcfwk">
        </div>
        <div class="form-group">
            <label>API Key</label>
            <input type="text" id="cloudinaryKey" placeholder="Contoh: 691892418329522">
        </div>
        <div class="form-group">
            <label>API Secret</label>
            <input type="password" id="cloudinarySecret" placeholder="Paste API Secret Anda di sini">
        </div>

        <button id="saveBtn" class="btn" style="margin-top: 24px;"><i class="fa-solid fa-floppy-disk"></i> Simpan
            Pengaturan</button>
        <a href="kling motion.html" id="backLink" style="text-decoration: none;">
            <button class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Kembali ke Aplikasi</button>
        </a>
    </div>

    <div id="toast">Berhasil disimpan!</div>

    <script>
        // Authentication handled by page-guard.js
        
        const els = {
            apiUrl: document.getElementById('cloudinaryApiUrl'),
            cloudName: document.getElementById('cloudName'),
            apiKey: document.getElementById('cloudinaryKey'),
            apiSecret: document.getElementById('cloudinarySecret'),
            syncBtn: document.getElementById('syncBtn'),
            syncIcon: document.getElementById('syncIcon'),
            saveBtn: document.getElementById('saveBtn'),
            toast: document.getElementById('toast'),
            backLink: document.getElementById('backLink')
        };

        // Fix back link if inside cpanel-deploy context (where the main file is index.html instead of kling motion.html)
        if (window.location.pathname.includes('index.html') || window.location.pathname.includes('cpanel-deploy')) {
            els.backLink.href = 'index.html';
        }

        function showToast(msg, type = 'success') {
            els.toast.textContent = msg;
            els.toast.style.background = type === 'success' ? 'var(--success)' : 'var(--danger)';
            els.toast.style.boxShadow = type === 'success' ? '0 4px 15px rgba(16, 185, 129, 0.3)' : '0 4px 15px rgba(239, 68, 68, 0.3)';
            els.toast.classList.add('show');
            setTimeout(() => els.toast.classList.remove('show'), 3000);
        }

        // Load config from local storage
        const DEFAULT_API_URL = 'https://firestore.googleapis.com/v1/projects/tekno-335f8/databases/(default)/documents/artifacts/default-app-id/public/data/public_files/cloudinary?key=AIzaSyCirtabCZOy3XMnNLUc-iKIYGegZJbPqhw';
        els.apiUrl.value = localStorage.getItem('texa_cloudinary_api_url') || DEFAULT_API_URL;
        els.cloudName.value = localStorage.getItem('texa_cloud_name') || 'duwtvcfwk';
        els.apiKey.value = localStorage.getItem('texa_cloudinary_key') || '691892418329522';
        els.apiSecret.value = localStorage.getItem('texa_cloudinary_secret') || '';

        // Save Function
        els.saveBtn.addEventListener('click', () => {
            localStorage.setItem('texa_cloudinary_api_url', els.apiUrl.value.trim());
            localStorage.setItem('texa_cloud_name', els.cloudName.value.trim());
            localStorage.setItem('texa_cloudinary_key', els.apiKey.value.trim());
            localStorage.setItem('texa_cloudinary_secret', els.apiSecret.value.trim());
            showToast('Konfigurasi berhasil disimpan!', 'success');
        });

        // Sync Function
        els.syncBtn.addEventListener('click', async () => {
            const url = els.apiUrl.value.trim();
            if (!url) {
                showToast('Silakan masukkan API URL.', 'error');
                return;
            }
            els.syncIcon.classList.add('fa-spin');
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Gagal mengakses API URL');
                const data = await response.json();

                const contentStr = data?.fields?.content?.stringValue || '';
                if (!contentStr) throw new Error('Format Firestore tidak sesuai');

                const lines = contentStr.split('\n').map(l => l.trim()).filter(l => l);
                let updated = 0;
                for (let i = 0; i < lines.length - 1; i++) {
                    if (lines[i].includes('Cloud Name')) { els.cloudName.value = lines[i + 1]; updated++; }
                    else if (lines[i].includes('API Key')) { els.apiKey.value = lines[i + 1]; updated++; }
                    else if (lines[i].includes('API Secret')) { els.apiSecret.value = lines[i + 1]; updated++; }
                }

                if (updated > 0) {
                    els.saveBtn.click(); // Auto-save after syncing
                } else {
                    showToast('Data Cloudinary tidak ditemukan di API.', 'error');
                }
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            } finally {
                els.syncIcon.classList.remove('fa-spin');
            }
        });

        // Auto Sync unconditionally on load if URL is present
        if (els.apiUrl.value) {
            setTimeout(() => els.syncBtn.click(), 500); // 500ms delay to let UI render first
        }
    </script>
    <script>
        // --- ADMIN ADVANCED ADDON ---
        document.querySelector('.container').style.maxWidth = '800px';

        const adminHtml = `
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 32px 0;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="margin: 0;"><i class="fa-solid fa-users"></i> Member Management</h2>
                <button onclick="addBlankUser()" class="btn btn-primary" style="padding: 6px 12px; width: auto; font-size: 13px;"><i class="fa-solid fa-plus"></i> Add Member</button>
            </div>
            
            <div style="overflow-x: auto; margin-bottom: 24px;">
                <table style="width: 100%; text-align: left; border-collapse: collapse; font-size: 13px;">
                    <thead>
                        <tr style="border-bottom: 1px solid var(--border); color: var(--text-secondary);">
                            <th style="padding: 8px;">Name</th>
                            <th style="padding: 8px;">Plan</th>
                            <th style="padding: 8px;">Hari</th>
                            <th style="padding: 8px;">Credits</th>
                            <th style="padding: 8px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody"><tr><td colspan="4">Loading...</td></tr></tbody>
                </table>
            </div>



            <h2><i class="fa-solid fa-key"></i> Daftar Token Server Admin (Rotasi)</h2>
            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <input type="text" id="newApiKey" placeholder="Input Token..." style="flex:1; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; font-family: monospace;">
                <button id="addKeyBtn" class="btn" style="padding: 8px 16px; width: auto; background: var(--success);">Add Key</button>
            </div>
            
            <!-- Bulk Actions -->
            <div id="bulkActionsBar" style="display: none; background: var(--surface-active); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; gap: 8px; align-items: center; flex-wrap: wrap;">
                <span id="selectedCount" style="color: var(--text-secondary); font-size: 13px; margin-right: 8px;">0 dipilih</span>
                <button onclick="bulkActivateKeys()" class="btn" style="padding: 6px 12px; width: auto; background: var(--success); font-size: 12px;"><i class="fa-solid fa-check-circle"></i> Aktifkan Terpilih</button>
                <button onclick="bulkDeactivateKeys()" class="btn" style="padding: 6px 12px; width: auto; background: var(--danger); font-size: 12px;"><i class="fa-solid fa-times-circle"></i> Matikan Terpilih</button>
                <button onclick="bulkDeleteKeys()" class="btn" style="padding: 6px 12px; width: auto; background: #991b1b; font-size: 12px; border: 1px solid #ef4444;"><i class="fa-solid fa-trash"></i> Hapus Terpilih</button>
                <button onclick="triggerAutoCleanup()" class="btn" style="padding: 6px 12px; width: auto; background: #4f46e5; font-size: 12px; margin-left: auto;" title="Otomatis bersihkan key yang mati > 3 hari"><i class="fa-solid fa-broom"></i> Auto Cleanup</button>
                <button onclick="clearSelection()" class="btn btn-outline" style="padding: 6px 12px; width: auto; font-size: 12px;"><i class="fa-solid fa-xmark"></i> Batal</button>
            </div>
            
            <div style="overflow-x: auto;">
                <table style="width: 100%; text-align: left; border-collapse: collapse; font-size: 13px;">
                    <thead>
                        <tr style="border-bottom: 1px solid var(--border); color: var(--text-secondary);">
                            <th style="padding: 8px; width: 30px;">
                                <input type="checkbox" id="selectAllKeys" onchange="toggleSelectAll(this)" style="cursor: pointer;" title="Pilih Semua">
                            </th>
                            <th style="padding: 8px;">API Key</th>
                            <th style="padding: 8px;">Usage</th>
                            <th style="padding: 8px;">Status</th>
                            <th style="padding: 8px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="keysTableBody"><tr><td colspan="5">Loading...</td></tr></tbody>
                </table>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 32px 0;">
            <h2><i class="fa-brands fa-whatsapp"></i> Pengaturan Notifikasi Topup</h2>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px;">
                <div>
                    <label style="font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; display: block;">Link Redirect WhatsApp Admin</label>
                    <input type="text" id="adminWhatsappLink" placeholder="Contoh: https://wa.me/6281234567890" style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px;">
                </div>
                <div>
                    <label style="font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; display: block;">Teks Peringatan Kredit Habis</label>
                    <textarea id="adminPopupText" rows="3" placeholder="Kredit Anda tidak mencukupi (0)." style="width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; resize: vertical;"></textarea>
                </div>
                <button onclick="saveAdminSettings()" class="btn btn-primary" style="width: auto; align-self: flex-start; padding: 8px 16px;"><i class="fa-solid fa-floppy-disk"></i> Simpan Pengaturan</button>
            </div>
        `;
        
        // Insert right before the "Kembali ke Aplikasi" link
        const backLink = document.getElementById('backLink');
        if (backLink) {
            backLink.href = '/';
            backLink.insertAdjacentHTML('beforebegin', adminHtml);
        }

        // API Fetching
        async function fetchAdminData(isBackground = false) {
            if (!isBackground) console.log('[ADMIN] Fetching admin data...');
            try {
                const [uRes, kRes, sRes] = await Promise.all([
                    fetch('/api/admin/users'), fetch('/api/admin/apikeys'), fetch('/api/admin/settings')
                ]);
                
                console.log('[ADMIN] Response status:', {
                    users: uRes.status,
                    apikeys: kRes.status,
                    settings: sRes.status
                });
                
                const uData = await uRes.json();
                const kData = await kRes.json();
                const sData = await sRes.json();

                console.log('[ADMIN] Data received:', {
                    users: uData.users?.length || 0,
                    apiKeys: kData.apiKeys?.length || 0,
                    settings: !!sData.settings
                });

                renderUsers(uData.users || []);
                renderApiKeys(kData.apiKeys || []);
                if (sData.settings) {
                    document.getElementById('adminWhatsappLink').value = sData.settings.whatsappLink || '';
                    document.getElementById('adminPopupText').value = sData.settings.popupText || '';
                }
            } catch (e) {
                console.error("[ADMIN] Gagal load data admin:", e);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = users.map(u => {
                const remainingDays = u.subscription_end_date 
                    ? Math.max(0, Math.ceil((new Date(u.subscription_end_date) - Date.now()) / (1000 * 60 * 60 * 24)))
                    : 0;
                return `
                <tr style="border-bottom: 1px solid var(--border);">
                    <td style="padding: 8px;">
                        <div style="display:flex; flex-direction:column; gap:4px;">
                            <input id="name_${u.id}" type="text" value="${u.name || ''}" placeholder="Nama Custom" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 4px; border-radius: 4px; font-size:12px;">
                            <div style="display:flex; gap:4px;">
                                <input id="voucher_${u.id}" type="text" value="${u.voucher_code || ''}" placeholder="Kode Voucher" style="flex:1; background: rgba(0,0,0,0.3); border: 1px solid var(--accent); color: var(--accent); padding: 4px; border-radius: 4px; font-size:12px; font-family:monospace;">
                                <button onclick="document.getElementById('voucher_${u.id}').value = 'TEKNO-' + Math.random().toString(36).substring(2, 8).toUpperCase()" class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; margin: 0; width: auto;" title="Generate Auto Code"><i class="fa-solid fa-bolt"></i></button>
                            </div>
                            <input id="mitra_wa_${u.id}" type="text" value="${u.mitra_whatsapp || ''}" placeholder="Mitra WhatsApp Link (Opsional)" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 4px; border-radius: 4px; font-size:11px;">
                            <textarea id="mitra_txt_${u.id}" placeholder="Mitra Popup Text (Opsional)" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 4px; border-radius: 4px; font-size:11px; resize:vertical; min-height:40px;">${u.mitra_popup_text || ''}</textarea>
                        </div>
                    </td>
                    <td style="padding: 8px; vertical-align:top;">
                        <select id="plan_${u.id}" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 4px; border-radius: 4px;">
                            <option value="free" ${u.plan==='free'?'selected':''}>Free</option>
                            <option value="pro" ${u.plan==='pro'?'selected':''}>Pro</option>
                            <option value="vip" ${u.plan==='vip'?'selected':''}>VIP</option>
                        </select>
                    </td>
                    <td style="padding: 8px; vertical-align:top;">
                        <input id="days_${u.id}" type="number" value="${remainingDays}" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 4px; border-radius: 4px; width:60px;">
                    </td>
                    <td style="padding: 8px; vertical-align:top;">
                        <input id="credits_${u.id}" type="number" value="${u.credits}" style="background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 4px; border-radius: 4px; width:60px;">
                    </td>
                    <td style="padding: 8px; vertical-align:top;">
                        <div style="display:flex; gap:4px;">
                            <button onclick="saveUser('${u.id}')" class="btn btn-primary" style="padding: 4px 8px; font-size: 11px; margin: 0; width: auto;"><i class="fa-solid fa-floppy-disk"></i></button>
                            <button onclick="deleteUser('${u.id}', this)" class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; color: var(--danger); border-color: var(--danger); margin: 0; width: auto; transition: 0.2s;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }



        function renderApiKeys(keys) {
            const tbody = document.getElementById('keysTableBody');
            if (!keys || keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-secondary);">Tidak ada API key. Klik "Add Key" untuk menambahkan.</td></tr>';
                return;
            }
            
            try {
                tbody.innerHTML = keys.map((k, index) => {
                    const isActive = k.is_active;
                    const bgColor = isActive ? 'transparent' : 'rgba(239, 68, 68, 0.1)';
                    const borderColor = isActive ? 'var(--border)' : 'var(--danger)';
                    const statusColor = isActive ? 'var(--success)' : 'var(--danger)';
                    const statusText = isActive ? 'Active' : 'Mati / Limit';
                    
                    return `
                        <tr style="border-bottom: 1px solid var(--border); background: ${bgColor};">
                            <td style="padding: 8px; text-align: center;">
                                <input type="checkbox" class="key-checkbox" data-key-id="${k.id}" onchange="updateBulkActions()" style="cursor: pointer;">
                            </td>
                            <td style="padding: 8px;">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <div style="display:flex; flex-direction:column; gap:2px;">
                                        <button onclick="moveKeyUp('${k.id}')" ${index === 0 ? 'disabled' : ''} class="btn btn-outline" style="padding: 2px 6px; font-size: 10px; margin: 0; width: auto;" title="Move Up"><i class="fa-solid fa-arrow-up"></i></button>
                                        <button onclick="moveKeyDown('${k.id}')" ${index === keys.length - 1 ? 'disabled' : ''} class="btn btn-outline" style="padding: 2px 6px; font-size: 10px; margin: 0; width: auto;" title="Move Down"><i class="fa-solid fa-arrow-down"></i></button>
                                    </div>
                                    <div style="flex:1;">
                                        <div style="display:flex; align-items:center; gap:4px; margin-bottom:4px;">
                                            <span style="font-size:11px; color:var(--text-secondary); font-weight:bold;">#${index + 1}</span>
                                            <input id="key_${k.id}" type="text" value="${k.key_string}" style="background: rgba(0,0,0,0.3); border: 1px solid ${borderColor}; color: white; padding: 4px; border-radius: 4px; font-family: monospace; width: 100%; font-size:11px;">
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td style="padding: 8px;">${k.usage_count || 0}</td>
                            <td style="padding: 8px; color: ${statusColor}; font-weight: bold;">${statusText}</td>
                            <td style="padding: 8px;">
                                <div style="display:flex; gap:4px; flex-wrap:wrap;">
                                    <button onclick="saveApiKey('${k.id}')" class="btn btn-primary" style="padding: 4px 8px; font-size: 11px; margin: 0; width: auto;"><i class="fa-solid fa-floppy-disk"></i></button>
                                    <button onclick="toggleApiKey('${k.id}', ${isActive})" class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; margin: 0; width: auto;"><i class="fa-solid fa-power-off"></i></button>
                                    <button onclick="deleteApiKey('${k.id}', this)" class="btn btn-outline" style="padding: 4px 8px; font-size: 11px; color: var(--danger); border-color: var(--danger); margin: 0; width: auto; transition: 0.2s;"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error rendering API keys:', error);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--danger);">Error rendering keys. Check console.</td></tr>';
            }
        }

        // Actions
        window.saveUser = async (id) => {
            const plan = document.getElementById('plan_' + id).value;
            const credits = document.getElementById('credits_' + id).value;
            const duration_days = document.getElementById('days_' + id).value;
            const name = document.getElementById('name_' + id).value;
            const voucher_code = document.getElementById('voucher_' + id).value;
            const mitra_wa = document.getElementById('mitra_wa_' + id);
            const mitra_txt = document.getElementById('mitra_txt_' + id);
            const mitra_whatsapp = mitra_wa ? mitra_wa.value.trim() : '';
            const mitra_popup_text = mitra_txt ? mitra_txt.value.trim() : '';

            await fetch('/api/admin/users', { 
                method: 'PUT', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({id, plan, credits, duration_days, name, voucher_code, mitra_whatsapp, mitra_popup_text})
            });
            fetchAdminData();
            showToast('User berhasil disimpan!', 'success');
        };

        window.saveAdminSettings = async () => {
            const wa = document.getElementById('adminWhatsappLink').value.trim();
            const pop = document.getElementById('adminPopupText').value.trim();
            try {
                await fetch('/api/admin/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ whatsappLink: wa, popupText: pop })
                });
                showToast('Pengaturan Notifikasi berhasil disimpan!', 'success');
            } catch(e) {
                showToast('Gagal menyimpan: ' + e.message, 'error');
            }
        };

        window.deleteUser = async (id, btn) => {
            if (!btn.dataset.confirm) {
                btn.dataset.confirm = '1';
                btn.innerHTML = 'Yakin?';
                btn.style.background = 'var(--danger)';
                btn.style.color = '#fff';
                setTimeout(() => {
                    if (btn) {
                        btn.dataset.confirm = '';
                        btn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                        btn.style.background = 'transparent';
                        btn.style.color = 'var(--danger)';
                    }
                }, 3000);
                return;
            }
            
            await fetch('/api/admin/users', { 
                method: 'DELETE', 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({id})
            });
            fetchAdminData();
            showToast('User dihapus!', 'success');
        };

        window.addBlankUser = async () => {
            await fetch('/api/admin/users', { method: 'POST' });
            fetchAdminData();
            showToast('Member baru ditambahkan!', 'success');
        };

        window.toggleApiKey = async (id, currentStatus) => {
            await fetch('/api/admin/apikeys', { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({id, is_active: !currentStatus})});
            fetchAdminData();
            showToast('Status Token diupdate', 'success');
        };

        window.saveApiKey = async (id) => {
            const key_string = document.getElementById('key_' + id).value;
            await fetch('/api/admin/apikeys', {
                method: 'PUT',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ id, key_string })
            });
            fetchAdminData();
            showToast('Token berhasil diupdate!', 'success');
        };

        window.deleteApiKey = async (id, btn) => {
            if (!btn.dataset.confirm) {
                btn.dataset.confirm = '1';
                btn.innerHTML = 'Yakin?';
                btn.style.background = 'var(--danger)';
                btn.style.color = '#fff';
                setTimeout(() => {
                    if (btn) {
                        btn.dataset.confirm = '';
                        btn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                        btn.style.background = 'transparent';
                        btn.style.color = 'var(--danger)';
                    }
                }, 3000);
                return;
            }
            await fetch('/api/admin/apikeys', {
                method: 'DELETE',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ id })
            });
            fetchAdminData();
            showToast('Token dihapus!', 'success');
        };

        // Move API Key Up (higher priority)
        window.moveKeyUp = async (id) => {
            try {
                await fetch('/api/admin/apikeys?action=reorder', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ id, direction: 'up' })
                });
                fetchAdminData();
                showToast('Token dipindah ke atas!', 'success');
            } catch(e) {
                showToast('Gagal memindahkan token', 'error');
            }
        };

        // Move API Key Down (lower priority)
        window.moveKeyDown = async (id) => {
            try {
                await fetch('/api/admin/apikeys?action=reorder', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ id, direction: 'down' })
                });
                fetchAdminData();
                showToast('Token dipindah ke bawah!', 'success');
            } catch(e) {
                showToast('Gagal memindahkan token', 'error');
            }
        };

        document.getElementById('addKeyBtn').addEventListener('click', async () => {
            const keyInput = document.getElementById('newApiKey');
            const key_string = keyInput.value.trim();
            if(!key_string) return;
            await fetch('/api/admin/apikeys', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({key_string})});
            keyInput.value = '';
            fetchAdminData();
            showToast('API Key ditambahkan!', 'success');
        });

        // Bulk Actions Functions
        window.toggleSelectAll = (checkbox) => {
            const checkboxes = document.querySelectorAll('.key-checkbox');
            checkboxes.forEach(cb => cb.checked = checkbox.checked);
            updateBulkActions();
        };

        window.updateBulkActions = () => {
            const checkboxes = document.querySelectorAll('.key-checkbox');
            const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
            const bulkBar = document.getElementById('bulkActionsBar');
            const selectedCount = document.getElementById('selectedCount');
            const selectAllCheckbox = document.getElementById('selectAllKeys');
            
            // Update count
            selectedCount.textContent = `${checkedBoxes.length} dipilih`;
            
            // Show/hide bulk actions bar
            if (checkedBoxes.length > 0) {
                bulkBar.style.display = 'flex';
            } else {
                bulkBar.style.display = 'none';
            }
            
            // Update select all checkbox state
            if (checkedBoxes.length === checkboxes.length && checkboxes.length > 0) {
                selectAllCheckbox.checked = true;
                selectAllCheckbox.indeterminate = false;
            } else if (checkedBoxes.length > 0) {
                selectAllCheckbox.indeterminate = true;
            } else {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            }
        };

        window.clearSelection = () => {
            const checkboxes = document.querySelectorAll('.key-checkbox');
            checkboxes.forEach(cb => cb.checked = false);
            document.getElementById('selectAllKeys').checked = false;
            updateBulkActions();
        };

        window.bulkActivateKeys = async () => {
            const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
            const keyIds = Array.from(checkedBoxes).map(cb => cb.dataset.keyId);
            
            if (keyIds.length === 0) return;
            
            try {
                // Send bulk update request
                await fetch('/api/admin/apikeys?action=bulk', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ ids: keyIds, is_active: true })
                });
                
                clearSelection();
                fetchAdminData();
                showToast(`${keyIds.length} token berhasil diaktifkan!`, 'success');
            } catch(e) {
                showToast('Gagal mengaktifkan token: ' + e.message, 'error');
            }
        };

        window.bulkDeactivateKeys = async () => {
            const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
            const keyIds = Array.from(checkedBoxes).map(cb => cb.dataset.keyId);
            
            if (keyIds.length === 0) return;
            
            try {
                // Send bulk update request
                await fetch('/api/admin/apikeys?action=bulk', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ ids: keyIds, is_active: false })
                });
                
                clearSelection();
                fetchAdminData();
                showToast(`${keyIds.length} token berhasil dimatikan!`, 'success');
            } catch(e) {
                showToast('Gagal mematikan token: ' + e.message, 'error');
            }
        };

        window.bulkDeleteKeys = async () => {
            const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
            const keyIds = Array.from(checkedBoxes).map(cb => cb.dataset.keyId);
            
            if (keyIds.length === 0) return;

            if (!confirm(`Anda yakin ingin menghapus ${keyIds.length} token ini secara manual?`)) return;
            
            try {
                await fetch('/api/admin/apikeys?action=bulk', {
                    method: 'DELETE',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ ids: keyIds })
                });
                
                clearSelection();
                fetchAdminData();
                showToast(`${keyIds.length} token berhasil dihapus!`, 'success');
            } catch(e) {
                showToast('Gagal menghapus token: ' + e.message, 'error');
            }
        };

        window.triggerAutoCleanup = async () => {
            if (!confirm('Anda yakin ingin membersihkan (hapus) semua token yang sudah mati lebih dari 3 hari?')) return;

            const btn = document.querySelector('button[onclick="triggerAutoCleanup()"]');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/apikeys/cleanup', {
                    method: 'POST', // POST required for manual admin trigger
                    headers: {
                        'Content-Type': 'application/json',
                        'x-auth-token': localStorage.getItem('texa_auth_token') || '' // Include auth token if needed
                    }
                });

                if (!res.ok) {
                    const errObj = await res.json();
                    throw new Error(errObj.error || 'Server error');
                }

                const data = await res.json();
                
                clearSelection();
                fetchAdminData();
                showToast(`Berhasil! ${data.deleted_count} token lama telah dihapus.`, 'success');
            } catch(e) {
                showToast('Gagal cleanup: ' + e.message, 'error');
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        };

        // Wait for page-guard to complete authentication, then fetch data
        window.addEventListener('DOMContentLoaded', () => {
            // Small delay to ensure page-guard has completed
            setTimeout(() => {
                fetchAdminData();
                
                // Real-time polling for keys (every 5 seconds)
                // Only update if admin is NOT currently selecting checkboxes to avoid interrupting their work
                setInterval(() => {
                    const checkedBoxes = document.querySelectorAll('.key-checkbox:checked');
                    const selectAllCheckbox = document.getElementById('selectAllKeys');
                    
                    if (checkedBoxes.length === 0 && (!selectAllCheckbox || !selectAllCheckbox.checked)) {
                        fetchAdminData(true); // pass true to indicate background fetch (could be used to suppress loading indicator)
                    }
                }, 5000);
                
            }, 500);
        });
    </script>
</body>

</html>
